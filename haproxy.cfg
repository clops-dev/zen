# -----------------------------------------------------------------------------
# Zen Gateway — HAProxy Production Load Balancer Configuration
#
# Usage:
#   Place this file on your HAProxy VM (e.g. at /etc/haproxy/haproxy.cfg) or
#   run via HAProxy Docker container:
#     docker run -d --name zen-haproxy -p 80:80 -p 443:443 \
#       -v /path/to/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
#       haproxy:2.8-alpine
#
# Key Design Features:
#   1. SSE / Chunked AI Streaming: `no option http-buffer-response` ensures
#      tokens/chunks stream to clients immediately without proxy-level buffering.
#   2. Extended Timeouts: `timeout client 10m`, `timeout server 10m`, and
#      `timeout tunnel 10m` prevent proxy aborts during long-reasoning model outputs.
#   3. Readiness-Based Routing: `option httpchk GET /readyz` checks gateway DB
#      connectivity every 3 seconds. When a gateway receives SIGTERM, /readyz
#      immediately returns 503 — HAProxy stops routing NEW requests to it while
#      in-flight streams drain.
#   4. Correlation Headers: Forwards X-Request-Id and client IP headers.
# -----------------------------------------------------------------------------

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    
    # ── Timeouts for Long-Running AI Generation ────────────────────────────
    timeout connect     5s       # Connection handshake budget to gateway backend
    timeout client      10m      # Max client inactivity (long streaming output)
    timeout server      10m      # Max server inactivity (slow model TTFB)
    timeout tunnel      10m      # WebSocket / long-lived HTTP tunnel window

frontend http_front
    bind *:80
    
    # ── Header Preservation ────────────────────────────────────────────────
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    
    # Preserve inbound X-Request-Id if set by client, else leave for Gateway middleware
    default_backend gateway_back

backend gateway_back
    mode http
    balance roundrobin
    
    # ── AI Streaming Optimization ─────────────────────────────────────────
    # Disable response buffering so Server-Sent Events (SSE) stream immediately
    no option http-buffer-response
    
    # ── Readiness Probing (/readyz) ────────────────────────────────────────
    # Probes /readyz every 3s. HTTP 200 = healthy. HTTP 503 = draining/down.
    option httpchk GET /readyz
    http-check expect status 200
    
    # Check parameters: inter 3s, fall 2 (mark DOWN after 2 fails = 6s), rise 2
    default-server inter 3s fall 2 rise 2 downinter 1s
    
    # ── Gateway Backends (Replace IPs with your actual Gateway VM IPs) ─────
    server gateway1 10.0.0.10:8787 check
    server gateway2 10.0.0.11:8787 check
